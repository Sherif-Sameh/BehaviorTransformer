[project]
name = "btransformer"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy >= 1.26.4",
    "matplotlib >= 3.8.4",
    "fire >= 0.6.0",
    "torch >= 2.0.0",
    "torchvision",
    "lerobot",
    "toml",
]
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.setuptools]
packages = ["btransformer"]

[tool.pixi.pypi-dependencies]
btransformer = { path = ".", editable = true }