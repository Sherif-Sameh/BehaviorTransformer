[project]
name = "btransformer"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy >= 1.26.4",
    "matplotlib >= 3.8.4",
    "fire >= 0.6.0",
    "torch >= 2.0.0",
    "torchvision",
    "pandas",
    "toml",
]
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pytest.ini_options]
markers = ["unit"]

[tool.setuptools]
packages = ["btransformer"]

[tool.pixi.pypi-dependencies]
btransformer = { path = ".", editable = true }

[tool.pixi.environments]
test = ["test"]
pusht = ["pusht"]

# Setup environment for testing
[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8.4"

# Setup environment for the PushT dataset/environment
[tool.pixi.feature.pusht.pypi-dependencies]
lerobot = ">=0.4"
gym-pusht = ">=0.1.6"
